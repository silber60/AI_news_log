[project]
name = "ai-newsletter"
version = "0.1.0"
description = "Weekly AI model brief: HF Papers Top 10 analyzed by Claude, mailed as a Korean newsletter"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=2.3,<3",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "tenacity>=9.2,<10",
    "jinja2>=3.1.6,<4",
    "css-inline>=0.23,<0.24",
    "pillow>=13,<14",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "respx>=0.23",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
