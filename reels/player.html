<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모닥로그 릴스 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg:#F5F5F2; --ink:#222222; --acc:#FF6B00; --soft:#FFF1E6; --line:#D6D6D1; --muted:#737373; --deep:#8A3A00; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#111111; color:#fff; overflow:hidden;
    font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #viewport { position:relative; overflow:hidden; border-radius:6px; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; overflow:hidden; background:var(--bg); color:var(--ink); }
  body.capture #wrap { display:block; }
  body.capture #viewport { width:1080px; height:1920px; border-radius:0; }
  body.capture #controls { display:none; }

  /* camera layer */
  #cam { position:absolute; inset:0; overflow:hidden; background-color:var(--bg);
    background-image:linear-gradient(rgba(0,0,0,.045) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.045) 2px, transparent 2px); }
  #world { position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0; }
  .panel { position:absolute; width:960px; height:680px; border-radius:48px; background:#FBFBF9; border:3px solid #fff;
    box-shadow:0 24px 64px rgba(0,0,0,.09); overflow:hidden; }
  .panel .inner { position:absolute; inset:0; }
  .panel svg { display:block; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.07) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.14) 100%); }

  /* HUD */
  .row { position:absolute; left:0; width:1080px; display:flex; align-items:center; justify-content:center; }
  #chapterRow { top:170px; height:130px; }
  .chap { position:absolute; display:flex; align-items:center; gap:24px; background:var(--ink); color:#fff; border-radius:999px;
    padding:26px 52px; box-shadow:0 14px 36px rgba(0,0,0,.18); white-space:nowrap; }
  .chap .no { font-weight:700; font-size:46px; }
  .chap .dv { width:3px; height:40px; background:rgba(255,255,255,.35); }
  .chap .ti { font-weight:600; font-size:46px; }
  #captionRow { top:1040px; height:192px; }
  .cap { position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; background:#2A2A2A; border-radius:36px;
    padding:16px 56px; border:2px solid rgba(0,0,0,.25); box-shadow:0 16px 40px rgba(0,0,0,.2); white-space:nowrap; max-width:1040px; }
  .cap .ko { font-weight:700; font-size:64px; line-height:84px; color:var(--acc); }
  .cap .en { font-weight:600; font-size:34px; line-height:44px; color:rgba(255,255,255,.88); }
  #progress { position:absolute; left:160px; top:1252px; width:760px; height:60px; }
  #progress .track { position:absolute; left:0; top:19px; width:760px; height:22px; border-radius:11px; background:#E3E3DE; box-shadow:inset 0 2px 4px rgba(0,0,0,.08); }
  #progress .bar { position:absolute; left:0; top:19px; height:22px; border-radius:11px; background:var(--acc); }
  #progress .dot { position:absolute; top:24px; width:12px; height:12px; border-radius:50%; background:#B8B8B2; }
  #progress .dot.on { background:rgba(255,255,255,.9); }
  #progress .knob { position:absolute; top:2px; width:56px; height:56px; border-radius:50%; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.2); }
  #otterShadow { position:absolute; left:390px; top:1686px; width:300px; height:40px; border-radius:50%; background:rgba(0,0,0,.12); filter:blur(18px); }
  .otter { position:absolute; left:340px; top:1318px; width:400px; height:400px; object-fit:contain; }

  #msg { position:absolute; left:60px; right:60px; top:860px; padding:32px; border-radius:24px; background:#C62828; color:#fff;
    font-size:40px; font-weight:700; text-align:center; display:none; z-index:10; }
  #warn { position:absolute; left:0; right:0; top:0; padding:18px 30px; background:#FFD54F; color:#222; font-size:28px; font-weight:600; display:none; z-index:10; white-space:pre-line; }

  #controls { display:flex; gap:10px; align-items:center; }
  button { font:inherit; font-size:15px; color:#fff; background:#1e1e1e; border:1px solid #333; border-radius:999px; padding:9px 18px; cursor:pointer; }
  button:hover { border-color:#555; }
  button.on { background:#0061F5; border-color:#0061F5; }
  #fc { font-variant-numeric:tabular-nums; font-size:13px; color:#9a9a9a; min-width:150px; text-align:right; }

  /* shared template pieces */
  .t-card { position:absolute; background:#fff; border:3.5px solid var(--ink); border-radius:32px; }
  .t-circle { position:absolute; border-radius:50%; background:var(--acc); border:3.5px solid var(--ink); display:flex; align-items:center; justify-content:center; }
  .t-title { position:absolute; font-weight:700; color:var(--ink); white-space:nowrap; }
  .t-sub { position:absolute; font-weight:500; color:var(--muted); white-space:nowrap; }
  .t-line { position:absolute; height:14px; border-radius:7px; background:var(--line); }
  .t-chip { position:absolute; display:flex; align-items:center; gap:12px; padding:14px 28px; border-radius:999px; background:var(--soft);
    color:var(--deep); font-weight:600; font-size:32px; white-space:nowrap; }
  .t-ph { position:absolute; inset:60px; border:4px dashed #bbb; border-radius:28px; display:flex; align-items:center; justify-content:center;
    font-size:44px; color:#999; font-weight:600; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="mb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur id="mbBlur" stdDeviation="0 0" edgeMode="duplicate"/>
  </filter>
</svg>
<div id="wrap">
  <div id="viewport">
    <div id="stage">
      <div id="cam"><div id="world"></div></div>
      <div id="vignette"></div>
      <div class="row" id="chapterRow"></div>
      <div class="row" id="captionRow"></div>
      <div id="progress"><div class="track"></div><div class="bar"></div><div class="knob"></div></div>
      <div id="otterShadow"></div>
      <img class="otter" id="otterA" alt=""><img class="otter" id="otterB" alt="">
      <div id="warn"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="controls">
    <button id="play" class="on">일시정지</button>
    <button id="slow">0.25배속</button>
    <button id="restart">처음부터</button>
    <span id="fc">0 / 0</span>
  </div>
</div>

<script id="core">
// Pure timing / camera / caption math. No DOM. Tested by reels/tests/core.test.mjs.
var ReelCore = (function () {
  var FPS = 30, ENTRY = 30, MOVE = 24, FADE = 8;
  var DWELL3 = [102, 102, 108];             // 13s model section: 30+102+24+102+24+108
  var TEMPLATES = ['stack-cards', 'wobble-graph', 'loop-pair', 'bars-rise', 'drop-in', 'grow-items',
    'swing-chain', 'typing-prompt', 'orbit-camera', 'film-strip', 'list-scroll', 'noise-reveal', 'cta-pair'];
  var PANEL_DX = 1080, SECTION_DY = 2400, CX = 540, CY = 680;
  var BLUR_PTS = [[540, 960], [240, 500], [840, 1420]];

  function bezier(x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    function sx(t) { return ((ax * t + bx) * t + cx) * t; }
    function sy(t) { return ((ay * t + by) * t + cy) * t; }
    function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
    return function (u) {
      if (u <= 0) return 0;
      if (u >= 1) return 1;
      var t = u, i;
      for (i = 0; i < 8; i++) {
        var e = sx(t) - u;
        if (Math.abs(e) < 1e-7) return sy(t);
        var d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      var lo = 0, hi = 1; t = u;
      for (i = 0; i < 40; i++) {
        var v = sx(t);
        if (Math.abs(v - u) < 1e-7) break;
        if (u > v) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
      return sy(t);
    };
  }
  var IN_OUT = bezier(0.65, 0, 0.35, 1);
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function validate(reel) {
    var err = [];
    if (!reel || !Array.isArray(reel.sections) || !reel.sections.length) return ['reel has no sections'];
    var sum = 0;
    reel.sections.forEach(function (s, si) {
      var id = s.id || ('#' + si);
      if (typeof s.seconds !== 'number' || s.seconds <= 0) err.push('section ' + id + ': seconds missing');
      sum += s.seconds || 0;
      var ps = s.panels || [];
      if (ps.length < 1 || ps.length > 3) err.push('section ' + id + ': panel count ' + ps.length + ' (must be 1-3)');
      ps.forEach(function (p, pi) {
        if (TEMPLATES.indexOf(p.template) < 0) err.push('section ' + id + ': unknown template \'' + p.template + '\'');
        var caps = p.captions || (p.caption ? [p.caption] : []);
        if (!caps.length) err.push('section ' + id + ' panel ' + (pi + 1) + ': no caption');
        caps.forEach(function (c) { if (!c || !c.ko || !c.en) err.push('section ' + id + ' panel ' + (pi + 1) + ': caption needs ko and en'); });
      });
    });
    if (Math.abs(sum - 60) > 1e-9) err.push('section seconds sum to ' + sum + ', must be 60');
    return err;
  }

  // Dwell lengths for a section of L frames with n panels (entry and moves fixed).
  function dwells(L, n) {
    if (n === 1) return [L - ENTRY];
    if (n === 2) { var a = Math.floor((L - ENTRY - MOVE) / 2); return [a, L - ENTRY - MOVE - a]; }
    var free = L - ENTRY - 2 * MOVE, base = DWELL3[0] + DWELL3[1] + DWELL3[2];
    var d0 = Math.round(free * DWELL3[0] / base), d1 = Math.round(free * DWELL3[1] / base);
    return [d0, d1, free - d0 - d1];
  }

  function buildTimeline(reel, fps) {
    fps = fps || FPS;
    var t = 0, sections = [], captions = [];
    reel.sections.forEach(function (s, si) {
      var L = Math.round(s.seconds * fps), start = t, end = t + L;
      var ps = s.panels || [], ds = dwells(L, ps.length), cur = start + ENTRY, panels = [];
      ps.forEach(function (p, pi) {
        var arrive = cur, leave = arrive + ds[pi];
        panels.push({ index: pi, arrive: arrive, leave: leave, template: p.template, props: p.props || {} });
        cur = leave + MOVE;
      });
      var caps = [];
      ps.forEach(function (p, pi) {
        if (p.captions) {
          var n = p.captions.length;
          p.captions.forEach(function (c, ci) {
            var at = typeof c.at === 'number' ? c.at : ci * s.seconds / n;
            caps.push({ ko: c.ko, en: c.en, start: start + Math.round(at * fps) });
          });
        } else if (p.caption) {
          // caption i>0 switches halfway through the move into its panel
          caps.push({ ko: p.caption.ko, en: p.caption.en, start: pi === 0 ? start : panels[pi].arrive - MOVE / 2 });
        }
      });
      caps.sort(function (a, b) { return a.start - b.start; });
      caps.forEach(function (c, ci) { c.end = ci + 1 < caps.length ? caps[ci + 1].start : end; c.section = si; captions.push(c); });
      sections.push({ id: s.id, index: si, start: start, end: end, seconds: s.seconds, chapter: s.chapter || {},
        otter: s.otter || 'magnifier', panels: panels, captions: caps });
      t = end;
    });
    return { fps: fps, total: t, sections: sections, captions: captions };
  }

  function sectionAt(tl, f) {
    for (var i = 0; i < tl.sections.length; i++) if (f < tl.sections[i].end) return i;
    return tl.sections.length - 1;
  }

  function captionAt(tl, f) {
    var cs = tl.captions, i = 0;
    while (i + 1 < cs.length && cs[i + 1].start <= f) i++;
    var cur = cs[i], next = cs[i + 1] || null, mix = 0;
    if (next) mix = clamp01((f - (next.start - FADE)) / FADE);
    return { cur: cur, next: next, mix: mix };
  }

  function panelCenter(si, pi) { return [CX + pi * PANEL_DX, CY + si * SECTION_DY]; }

  function cameraAt(tl, f) {
    var si = sectionAt(tl, f), s = tl.sections[si], ps = s.panels;
    var first = panelCenter(si, 0);
    if (f < s.start + ENTRY) {
      var p = clamp01((f - s.start) / ENTRY), e = IN_OUT(p);
      if (si === 0) return { s: lerp(0.6, 1, e), x: first[0], y: first[1] };
      var prev = tl.sections[si - 1], from = panelCenter(si - 1, prev.panels.length - 1);
      return { s: 1 - 0.4 * Math.sin(Math.PI * e), x: lerp(from[0], first[0], e), y: lerp(from[1], first[1], e) };
    }
    for (var i = 0; i < ps.length; i++) {
      var c = panelCenter(si, i);
      if (f < ps[i].leave || i === ps.length - 1) return { s: 1, x: c[0], y: c[1] };
      if (f < ps[i].leave + MOVE) {
        var n = panelCenter(si, i + 1), q = IN_OUT((f - ps[i].leave) / MOVE);
        return { s: 1, x: lerp(c[0], n[0], q), y: lerp(c[1], n[1], q) };
      }
    }
    return { s: 1, x: first[0], y: first[1] };
  }

  function blurAt(tl, f) {
    if (f <= 0) return { bx: 0, by: 0 };
    var a = cameraAt(tl, f), b = cameraAt(tl, f - 1), dx = 0, dy = 0;
    BLUR_PTS.forEach(function (q) {
      var wx = (q[0] - CX) / a.s + a.x, wy = (q[1] - CY) / a.s + a.y;   // world point under q now
      var px = (wx - b.x) * b.s + CX, py = (wy - b.y) * b.s + CY;     // where it was a frame ago
      dx = Math.max(dx, Math.abs(q[0] - px)); dy = Math.max(dy, Math.abs(q[1] - py));
    });
    var bx = Math.min(60, dx * 180 / 360 / 2.5), by = Math.min(60, dy * 180 / 360 / 2.5);
    return { bx: bx < 0.05 ? 0 : bx, by: by < 0.05 ? 0 : by };
  }

  return { FPS: FPS, ENTRY: ENTRY, MOVE: MOVE, FADE: FADE, TEMPLATES: TEMPLATES, PANEL_DX: PANEL_DX, SECTION_DY: SECTION_DY,
    CX: CX, CY: CY, bezier: bezier, IN_OUT: IN_OUT, clamp01: clamp01, lerp: lerp, validate: validate,
    buildTimeline: buildTimeline, sectionAt: sectionAt, captionAt: captionAt, cameraAt: cameraAt, blurAt: blurAt,
    panelCenter: panelCenter };
})();
if (typeof window !== 'undefined') window.ReelCore = ReelCore;
</script>

<script id="templates">
// Scene templates: registerTemplate(name, { mount(el, props) -> state, update(state, lf) })
// lf = local frame; 0 is 9 frames (0.3s) before the camera arrives at the panel.
var TEMPLATES = {};
function registerTemplate(name, def) { TEMPLATES[name] = def; }
var TPL = (function () {
  var C = ReelCore;
  function el(parent, cls, css, html) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    if (css) Object.assign(d.style, css);
    if (html != null) d.innerHTML = html;
    parent.appendChild(d); return d;
  }
  function px(v) { return v + 'px'; }
  var ICON = {
    pen: '<path d="M9 39l3-11L31 9l8 8-19 19z"/><path d="M27 13l8 8"/>',
    check: '<circle cx="24" cy="24" r="15"/><path d="M17 24l5 5 9-10"/>',
    loop: '<path d="M11 21a14 14 0 0 1 25-7"/><path d="M37 7v8h-8"/><path d="M37 27a14 14 0 0 1-25 7"/><path d="M11 41v-8h8"/>',
    image: '<rect x="7" y="10" width="34" height="28" rx="5"/><circle cx="18" cy="20" r="3.5"/><path d="M8 35l11-10 8 7 5-5 9 8"/>',
    spark: '<path d="M24 6l4.5 13.5L42 24l-13.5 4.5L24 42l-4.5-13.5L6 24l13.5-4.5z"/>',
    chat: '<path d="M8 10h32v22H21l-9 8v-8H8z"/>',
    camera: '<rect x="5" y="14" width="27" height="21" rx="5"/><path d="M32 21l11-6v19l-11-6"/>',
    star: '<path d="M24 7l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z"/>',
    hair: '<path d="M12 40c0-18 6-30 12-30s12 12 12 30"/><path d="M18 40c0-14 3-22 6-22s6 8 6 22"/>',
    mail: '<rect x="6" y="11" width="36" height="26" rx="4"/><path d="M7 13l17 13 17-13"/>',
    insta: '<rect x="8" y="8" width="32" height="32" rx="9"/><circle cx="24" cy="24" r="7.5"/><circle cx="33.5" cy="14.5" r="1.6"/>'
  };
  function icon(name, size, color, fill) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" fill="' + (fill || 'none') + '" stroke="' + (color || '#222') +
      '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">' + (ICON[name] || '') + '</svg>';
  }
  function chip(parent, text, x, y) {
    return el(parent, 't-chip', { left: px(x), top: px(y) }, icon('star', 30, '#FF6B00', '#FF6B00') + '<span>' + text.replace(/^★\s*/, '') + '</span>');
  }
  var E = C.IN_OUT, cl = C.clamp01, lerp = C.lerp;
  var BACK = C.bezier(0.34, 1.56, 0.64, 1);   // overshoot pop
  return { el: el, px: px, icon: icon, chip: chip, E: E, cl: cl, lerp: lerp, BACK: BACK };
})();

// Placeholder used for any template not implemented yet.
var PLACEHOLDER = {
  mount: function (root, props, name) { TPL.el(root, 't-ph', null, name); return {}; },
  update: function () {}
};

(function () {
  var T = TPL, el = T.el, px = T.px, icon = T.icon, E = T.E, cl = T.cl, lerp = T.lerp, BACK = T.BACK;
  var W = 954, H = 674, ACC = '#FF6B00', INK = '#222222', SOFT = '#FFF1E6';
  function prog(lf, a, d) { return cl((lf - a) / d); }
  function set(n, css) { Object.assign(n.style, css); }
  function title(root, t, s, x, y) {
    var a = el(root, 't-title', { left: px(x || 50), top: px(y || 36), fontSize: '46px' }, t);
    var b = s ? el(root, 't-sub', { left: px(x || 50), top: px((y || 36) + 64), fontSize: '28px' }, s) : null;
    return [a, b];
  }
  function card(root, x, y, w, h) { return el(root, 't-card', { left: px(x), top: px(y), width: px(w), height: px(h) }); }
  function circle(root, name, size, x, y, bg) {
    return el(root, 't-circle', { left: px(x), top: px(y), width: px(size), height: px(size), background: bg || ACC }, icon(name, Math.round(size * 0.52)));
  }
  function line(root, x, y, w) { return el(root, 't-line', { left: px(x), top: px(y), width: px(w) }); }
  function scenery(w, h, k) {
    var pal = [['#FFD8B8', '#FF9A4D', '#C4561A'], ['#CFE3FF', '#7FA8E8', '#4C6FB8'], ['#D9F0D9', '#7CC08A', '#3F8A52'], ['#E6DDFB', '#9C86E0', '#6A54B0']][k % 4];
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><rect width="200" height="200" fill="' + pal[0] + '"/>' +
      '<circle cx="' + (130 - (k % 3) * 20) + '" cy="58" r="22" fill="#fff"/>' +
      '<ellipse cx="60" cy="190" rx="170" ry="80" fill="' + pal[1] + '"/><ellipse cx="170" cy="210" rx="120" ry="70" fill="' + pal[2] + '"/></svg>';
  }
  function popIn(n, lf, a, d, from) { var p = prog(lf, a, d), b = BACK(p); n.style.opacity = cl(p * 3); n.style.transform = 'translateY(' + ((from || 60) * (1 - b)) + 'px) scale(' + lerp(0.85, 1, b) + ')'; }

  registerTemplate('stack-cards', {
    mount: function (root, p) {
      var head = el(root, null, { position: 'absolute', left: 0, right: 0, top: '34px', textAlign: 'center' },
        '<div style="font-size:30px;font-weight:600;color:#737373">' + (p.eyebrow || '') + '</div><div style="font-size:64px;font-weight:700;color:#222;margin-top:6px">' + (p.title || '') + '</div>');
      var cards = (p.cards || []).map(function (c, i) {
        var col = i % 5, row = Math.floor(i / 5), x = 33 + col * 182, y = 214 + row * 222;
        var d = card(root, x, y, 160, 200);
        d.style.borderColor = i === 0 ? ACC : INK; d.style.borderWidth = i === 0 ? '5px' : '3.5px';
        d.innerHTML = '<div style="position:absolute;left:14px;top:14px;width:52px;height:52px;border-radius:50%;border:3px solid #222;background:' + (i === 0 ? ACC : '#fff') +
          ';color:' + (i === 0 ? '#fff' : '#222') + ';font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center">' + c.rank + '</div>' +
          '<div style="position:absolute;left:14px;top:84px;right:10px;font-weight:700;font-size:' + (c.name.length > 8 ? 21 : 26) + 'px;white-space:nowrap">' + c.name + '</div>' +

<script id="player">
(function () {
  var C = ReelCore, FPS = 30, PAUSE_MS = 1000;

  if (capture) document.body.classList.add('capture');

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), viewport = $('viewport'), cam = $('cam'), world = $('world'), blurEl = $('mbBlur');
  var chapterRow = $('chapterRow'), captionRow = $('captionRow'), prog = $('progress');
  var bar = prog.querySelector('.bar'), knob = prog.querySelector('.knob');
  var otterA = $('otterA'), otterB = $('otterB'), fc = $('fc');
  var OTTER = { magnifier: 'assets/otter-magnifier.png', chalkboard: 'assets/otter-chalkboard.png' };

  var reel, tl, panels = [], dots = [], chapA, chapB, capA, capB;
  window.__ready = false; window.__errors = [];

  function fit() {
    if (capture) { stage.style.transform = 'none'; return; }
    var k = Math.min(window.innerWidth / 1080, (window.innerHeight - 64) / 1920);

    stage.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit); fit();

  function fail(text) { var m = $('msg'); m.textContent = text; m.style.display = 'block'; }

  function makeChap() {
    var d = document.createElement('div'); d.className = 'chap';
    d.innerHTML = '<span class="no"></span><span class="dv"></span><span class="ti"></span>';
    chapterRow.appendChild(d); return d;
  }
  function setChap(d, ch) {
    if (d._key === ch) return; d._key = ch;
    d.querySelector('.no').textContent = ch.no || ''; d.querySelector('.ti').textContent = ch.title || '';
  }
  function makeCap() {
    var d = document.createElement('div'); d.className = 'cap';
    d.innerHTML = '<div class="ko"></div><div class="en"></div>';
    captionRow.appendChild(d); return d;
  }
  var fitCache = {};
  function setCap(d, c) {
    if (!c) { d.style.visibility = 'hidden'; return; }
    d.style.visibility = 'visible';
    if (d._key === c) return; d._key = c;
    var ko = d.querySelector('.ko'), en = d.querySelector('.en');
    ko.textContent = c.ko; en.textContent = c.en;
    var size = fitCache[c.ko + '|' + c.en];
    if (size == null) {            // shrink Korean (and English) so the pill stays within 968px
      ko.style.fontSize = '64px'; en.style.fontSize = '34px';
      var w = Math.max(ko.scrollWidth, en.scrollWidth), max = 968 - 112 - 4;   // padding 56×2 + border 2×2
      size = w > max ? max / w : 1; fitCache[c.ko + '|' + c.en] = size;
    }

    var g = 60 * c.s;
    cam.style.backgroundSize = g + 'px ' + g + 'px';

    else otterB.style.display = 'none';

  }

    render(0); window.__ready = true;
    requestAnimationFrame(tick);
  }).catch(function (e) {
    fail('reel.json을 읽지 못했어요: ' + week + '/reel.json (' + e.message + ')');
    window.__errors = ['load failed: ' + e.message]; window.__ready = true;
