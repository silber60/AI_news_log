<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모닥로그 릴스 플레이어</title>
</head>
<body>
<script id="core">
// Pure timing / camera / caption math. No DOM. Tested by reels/tests/core.test.mjs.
var ReelCore = (function () {
  var FPS = 30, ENTRY = 30, MOVE = 24, FADE = 8;
  var DWELL3 = [102, 102, 108];             // 13s model section: 30+102+24+102+24+108
  var TEMPLATES = ['stack-cards', 'wobble-graph', 'loop-pair', 'bars-rise', 'drop-in', 'grow-items',
    'swing-chain', 'typing-prompt', 'orbit-camera', 'film-strip', 'list-scroll', 'noise-reveal', 'cta-pair'];
  var PANEL_DX = 1080, SECTION_DY = 2400, CX = 540, CY = 680;
  var BLUR_PTS = [[540, 960], [240, 500], [840, 1420]];

  function bezier(x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    function sx(t) { return ((ax * t + bx) * t + cx) * t; }
    function sy(t) { return ((ay * t + by) * t + cy) * t; }
    function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
    return function (u) {
      if (u <= 0) return 0;
      if (u >= 1) return 1;
      var t = u, i;
      for (i = 0; i < 8; i++) {
        var e = sx(t) - u;
        if (Math.abs(e) < 1e-7) return sy(t);
        var d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      var lo = 0, hi = 1; t = u;
      for (i = 0; i < 40; i++) {
        var v = sx(t);
        if (Math.abs(v - u) < 1e-7) break;
        if (u > v) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
      return sy(t);
    };
  }
  var IN_OUT = bezier(0.65, 0, 0.35, 1);
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function validate(reel) {
    var err = [];
    if (!reel || !Array.isArray(reel.sections) || !reel.sections.length) return ['reel has no sections'];
    var sum = 0;
    reel.sections.forEach(function (s, si) {
      var id = s.id || ('#' + si);
      if (typeof s.seconds !== 'number' || s.seconds <= 0) err.push('section ' + id + ': seconds missing');
      sum += s.seconds || 0;
      var ps = s.panels || [];
      if (ps.length < 1 || ps.length > 3) err.push('section ' + id + ': panel count ' + ps.length + ' (must be 1-3)');
      ps.forEach(function (p, pi) {
        if (TEMPLATES.indexOf(p.template) < 0) err.push('section ' + id + ': unknown template \'' + p.template + '\'');
        var caps = p.captions || (p.caption ? [p.caption] : []);
        if (!caps.length) err.push('section ' + id + ' panel ' + (pi + 1) + ': no caption');
        caps.forEach(function (c) { if (!c || !c.ko || !c.en) err.push('section ' + id + ' panel ' + (pi + 1) + ': caption needs ko and en'); });
      });
    });
    if (Math.abs(sum - 60) > 1e-9) err.push('section seconds sum to ' + sum + ', must be 60');
    return err;
  }

  // Dwell lengths for a section of L frames with n panels (entry and moves fixed).
  function dwells(L, n) {
    if (n === 1) return [L - ENTRY];
    if (n === 2) { var a = Math.floor((L - ENTRY - MOVE) / 2); return [a, L - ENTRY - MOVE - a]; }
    var free = L - ENTRY - 2 * MOVE, base = DWELL3[0] + DWELL3[1] + DWELL3[2];
    var d0 = Math.round(free * DWELL3[0] / base), d1 = Math.round(free * DWELL3[1] / base);
    return [d0, d1, free - d0 - d1];
  }

  function buildTimeline(reel, fps) {
    fps = fps || FPS;
    var t = 0, sections = [], captions = [];
    reel.sections.forEach(function (s, si) {
      var L = Math.round(s.seconds * fps), start = t, end = t + L;
      var ps = s.panels || [], ds = dwells(L, ps.length), cur = start + ENTRY, panels = [];
      ps.forEach(function (p, pi) {
        var arrive = cur, leave = arrive + ds[pi];
        panels.push({ index: pi, arrive: arrive, leave: leave, template: p.template, props: p.props || {} });
        cur = leave + MOVE;
      });
      var caps = [];
      ps.forEach(function (p, pi) {
        if (p.captions) {
          var n = p.captions.length;
          p.captions.forEach(function (c, ci) {
            var at = typeof c.at === 'number' ? c.at : ci * s.seconds / n;
            caps.push({ ko: c.ko, en: c.en, start: start + Math.round(at * fps) });
          });
        } else if (p.caption) {
          // caption i>0 switches halfway through the move into its panel
          caps.push({ ko: p.caption.ko, en: p.caption.en, start: pi === 0 ? start : panels[pi].arrive - MOVE / 2 });
        }
      });
      caps.sort(function (a, b) { return a.start - b.start; });
      caps.forEach(function (c, ci) { c.end = ci + 1 < caps.length ? caps[ci + 1].start : end; c.section = si; captions.push(c); });
      sections.push({ id: s.id, index: si, start: start, end: end, seconds: s.seconds, chapter: s.chapter || {},
        otter: s.otter || 'magnifier', panels: panels, captions: caps });
      t = end;
    });
    return { fps: fps, total: t, sections: sections, captions: captions };
  }

  function sectionAt(tl, f) {
    for (var i = 0; i < tl.sections.length; i++) if (f < tl.sections[i].end) return i;
    return tl.sections.length - 1;
  }

  function captionAt(tl, f) {
    var cs = tl.captions, i = 0;
    while (i + 1 < cs.length && cs[i + 1].start <= f) i++;
    var cur = cs[i], next = cs[i + 1] || null, mix = 0;
    if (next) mix = clamp01((f - (next.start - FADE)) / FADE);
    return { cur: cur, next: next, mix: mix };
  }

  function panelCenter(si, pi) { return [CX + pi * PANEL_DX, CY + si * SECTION_DY]; }

  function cameraAt(tl, f) {
    var si = sectionAt(tl, f), s = tl.sections[si], ps = s.panels;
    var first = panelCenter(si, 0);
    if (f < s.start + ENTRY) {
      var p = clamp01((f - s.start) / ENTRY), e = IN_OUT(p);
      if (si === 0) return { s: lerp(0.6, 1, e), x: first[0], y: first[1] };
      var prev = tl.sections[si - 1], from = panelCenter(si - 1, prev.panels.length - 1);
      return { s: 1 - 0.4 * Math.sin(Math.PI * e), x: lerp(from[0], first[0], e), y: lerp(from[1], first[1], e) };
    }
    for (var i = 0; i < ps.length; i++) {
      var c = panelCenter(si, i);
      if (f < ps[i].leave || i === ps.length - 1) return { s: 1, x: c[0], y: c[1] };
      if (f < ps[i].leave + MOVE) {
        var n = panelCenter(si, i + 1), q = IN_OUT((f - ps[i].leave) / MOVE);
        return { s: 1, x: lerp(c[0], n[0], q), y: lerp(c[1], n[1], q) };
      }
    }
    return { s: 1, x: first[0], y: first[1] };
  }

  function blurAt(tl, f) {
    if (f <= 0) return { bx: 0, by: 0 };
    var a = cameraAt(tl, f), b = cameraAt(tl, f - 1), dx = 0, dy = 0;
    BLUR_PTS.forEach(function (q) {
      var wx = (q[0] - CX) / a.s + a.x, wy = (q[1] - CY) / a.s + a.y;   // world point under q now
      var px = (wx - b.x) * b.s + CX, py = (wy - b.y) * b.s + CY;     // where it was a frame ago
      dx = Math.max(dx, Math.abs(q[0] - px)); dy = Math.max(dy, Math.abs(q[1] - py));
    });
    var bx = Math.min(60, dx * 180 / 360 / 2.5), by = Math.min(60, dy * 180 / 360 / 2.5);
    return { bx: bx < 0.05 ? 0 : bx, by: by < 0.05 ? 0 : by };
  }

  return { FPS: FPS, ENTRY: ENTRY, MOVE: MOVE, FADE: FADE, TEMPLATES: TEMPLATES, PANEL_DX: PANEL_DX, SECTION_DY: SECTION_DY,
    CX: CX, CY: CY, bezier: bezier, IN_OUT: IN_OUT, clamp01: clamp01, lerp: lerp, validate: validate,
    buildTimeline: buildTimeline, sectionAt: sectionAt, captionAt: captionAt, cameraAt: cameraAt, blurAt: blurAt,
    panelCenter: panelCenter };
})();
if (typeof window !== 'undefined') window.ReelCore = ReelCore;
</script>
</body>
</html>
