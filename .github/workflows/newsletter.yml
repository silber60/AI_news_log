name: newsletter

# Two Monday runs in KST (D-01): 06:00 builds the previous week and mails the owner a test,
# 08:00 sends that issue to the subscribers. Manual dispatch keeps working for every mode.
# UTC fallback if the timezone key is ever dropped: "0 21 * * 0" (test) and "0 23 * * 0" (send);
# the send literal in MODE below must then change with it.
on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Asia/Seoul"
    - cron: "0 8 * * 1"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = artifact only, test = owner test inbox, send = subscriber list"
        type: choice
        options: [preview, test, send]
        default: preview
        required: true
      week:
        description: "YYYY-Www (blank = previous week in KST)"
        type: string
        required: false
        default: ""
      allow_stale:
        description: "send even outside the issue's Monday send day in KST (deliberate recovery only)"
        type: boolean
        default: false
      force_stage:
        description: "recompute this build stage and every later one (none = reuse every checkpoint)"
        type: choice
        options: [none, fetch, analyze, enrich, notes, trend, highlight, explainer, headline, polish]
        default: none

# The default token is read-only. Only the publish job gets contents: write: after a send
# it commits the explainer topic record (D-06, D-15) and the web pages (D-03) in one push,
# then uploads docs/ as the Pages artifact. Only the deploy-pages job gets pages: write and
# id-token: write (a GITHUB_TOKEN push never triggers a Pages build, research Pitfall 1).
# Phase 5: the same job also commits archive/<week>/ and data/ledger/ after every test or send
# run, success or failure (D-04, AUTO-03).
permissions:
  contents: read

# One group with import-subscribers; queue: max keeps every pending run waiting instead of
# cancelling it (D-08). queue: max cannot be combined with cancel-in-progress: true.
concurrency:
  group: newsletter
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets at job level: each secret is scoped to the step that needs it.
    env:
      # Only the exact 08:00 cron sends; any other schedule is a test (fail safe, D-01).
      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 8 * * 1' && 'send' || 'test') || inputs.mode }}
      WEEK_INPUT: ${{ inputs.week }}  # reaches the shell via env only; validated in Python
      ALLOW_STALE: ${{ inputs.allow_stale }}  # '' on a schedule; only the literal true counts
      FORCE_STAGE: ${{ inputs.force_stage }}  # '' on a schedule = reuse every checkpoint (D-04)
      CLAUDE_MODEL: claude-sonnet-5-5
      PYTHONUNBUFFERED: "1"
    outputs:
      mode: ${{ env.MODE }}
      outcome: ${{ steps.deliver.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}  # branch tip, not the run's frozen SHA (queued runs, re-runs)
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Trigger
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: echo "event=$GITHUB_EVENT_NAME schedule=$SCHEDULE_CRON mode=$MODE"
      - name: Build issue (content only; no delivery secrets)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # D-09: read-only job token for the GitHub license API (contents: read).
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m newsletter build --week "$WEEK_INPUT" --force-stage "$FORCE_STAGE"
      - name: Upload de-personalized preview
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: issue-${{ github.run_id }}
          # raw.json, selected.json, issue.json, email.html (구독자님), email.txt (D-14)
          path: archive/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - name: Deliver
        id: deliver
        if: ${{ env.MODE == 'test' || env.MODE == 'send' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_RECIPIENT: ${{ env.MODE == 'test' && secrets.TEST_RECIPIENT || '' }}
          SUBSCRIBERS_CSV: ${{ env.MODE == 'send' && secrets.SUBSCRIBERS_CSV || '' }}
          UNSUBSCRIBE_TOKEN_SECRET: ${{ secrets.UNSUBSCRIBE_TOKEN_SECRET }}
          UNSUBSCRIBE_LIST_KEY: ${{ env.MODE == 'send' && secrets.UNSUBSCRIBE_LIST_KEY || '' }}
          SUBSCRIBER_LIST_KEY: ${{ env.MODE == 'send' && secrets.SUBSCRIBER_LIST_KEY || '' }}
          # D-02: the pause switch reaches only scheduled runs; a dispatch always sends.
          SEND_PAUSED: ${{ github.event_name == 'schedule' && vars.SEND_PAUSED || '' }}
        run: |
          if [ "$ALLOW_STALE" = "true" ]; then
            uv run python -m newsletter deliver --mode "$MODE" --allow-stale
          else
            uv run python -m newsletter deliver --mode "$MODE"
          fi
      # Hashes only (D-05); the publish job commits it even after a failed send.
      - name: Ledger artifact (send only)
        if: ${{ always() && env.MODE == 'send' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ledger-${{ github.run_id }}
          path: data/ledger/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - name: Failure notice (test/send only, D-13)
        if: ${{ failure() && inputs.mode != 'preview' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
        run: uv run python -m newsletter notify-failure --mode "$MODE"

  publish:
    needs: run
    # Every test or send run on main, even a failed or cancelled one (AUTO-03, D-04); preview
    # commits nothing. The topic record, web pages and Pages artifact follow only a sent issue.
    # The only job with a write-scoped token, and the one serialized push path (D-08).
    # Keepalive (D-07): this weekly content commit is the repository activity that stops the
    # 60-day schedule auto-disable. No actions: write and no re-enable step (owner, A3). If the
    # schedule is ever disabled: Actions tab, newsletter, Enable workflow.
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode != 'preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MODE: ${{ needs.run.outputs.mode }}
      OUTCOME: ${{ needs.run.outputs.outcome }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}  # branch tip, not the run's frozen SHA (queued runs, re-runs)
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies (publish)
        run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: issue-${{ github.run_id }}
          path: archive/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: ledger-${{ github.run_id }}
          path: data/ledger/
      - name: Append explainer topic
        if: ${{ env.OUTCOME == 'sent' }}
        run: uv run python -m newsletter record-topic --mode "$MODE"
      - name: Publish web pages
        if: ${{ env.OUTCOME == 'sent' }}
        run: uv run python -m newsletter publish --mode "$MODE"
      - name: Commit archive, ledger, record and pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one path at a time: git add fails on a missing pathspec
          for path in archive data/ledger data/explainer_topics.json data/issues docs; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          git diff --cached --quiet && exit 0
          # identity is needed by both the commit and the rebase in the retry loop
          git config user.name silber60
          git config user.email 81203897+silber60@users.noreply.github.com
          git commit -m "chore(newsletter): archive, ledger and publish"
          for i in 1 2 3; do
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main \
              && git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      # Uploaded from this working tree after the commit, so the artifact holds the new pages
      # (research Pitfall 9: a deploy job checking out github.sha would be stale).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: ${{ env.OUTCOME == 'sent' }}
        with:
          path: docs/

  deploy-pages:
    needs: [run, publish]
    # !cancelled() replaces the implicit success(): after a full send the deploy must still run
    # when a later run-job step failed but the always() publish job committed the pages.
    if: ${{ !cancelled() && needs.run.outputs.outcome == 'sent' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout and no secrets: it only deploys the artifact the publish job uploaded.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
