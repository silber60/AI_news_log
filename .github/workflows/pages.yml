name: pages

# Deploys docs/ to GitHub Pages (source: GitHub Actions) on human pushes that touch docs/
# and on manual dispatch. A send run deploys from newsletter.yml instead: pushes made with
# the job token never trigger workflows, so the two never double-deploy (research Pattern 4).
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout and no secrets: it only deploys the artifact the build job uploaded.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
